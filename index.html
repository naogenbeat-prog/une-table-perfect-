<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ▼ 検索結果に表示されるタイトル -->
    <title>UNE TABLE（ユヌ・ターブル） | 高級ケータリングサービス</title>
    
    <!-- ▼ 検索結果に表示される説明文（100文字前後がおすすめ） -->
    <meta name="description" content="華やかな装いをあなただけの空間へ。UNE TABLEは、厳選された旬の食材と最高峰のサービスで、特別なレセプションやパーティーを演出する高級ケータリングサービスです。立食から着席フルコースまでオーダーメイドで対応いたします。" />
    
    <!-- ▼ OGP設定（LINEやSNSでURLが送られた時に出るカードの設定） -->
    <meta property="og:title" content="UNE TABLE | 高級ケータリングサービス" />
    <meta property="og:description" content="特別な日に最高峰のケータリングをお届け致します。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://une-table-perfect.vercel.app/" />
    <!-- ▼ SNSでシェアされた時に出る画像 -->
    <meta property="og:image" content="https://une-table-perfect.vercel.app/cocktail-1-8-1.png" />
    <meta property="og:site_name" content="UNE TABLE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
